name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes between 4:00 AM and 3:59 PM UTC (9:30 AM to 9:30 PM IST)
    - cron: '*/10 4-15 * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -s -f https://finintel-m47z.onrender.com/health || echo "Ping failed"
